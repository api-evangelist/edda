aid: edda
name: EDDA Technology
description: EDDA Technology, Inc. is a Princeton, New Jersey medical imaging software company behind the IQQA platform
  for computer-assisted radiology and surgery. IQQA delivers 3D quantitative image analysis, automated segmentation
  and volumetric measurement over CT and MR studies, supporting pre-surgical planning and simulation, intra-operative
  guidance and monitoring, post-operative follow-up evaluation, and clinical training across liver, lung, kidney
  and interventional oncology. Products include IQQA-BodyImaging, IQQA-Guide, IQQA-Chest, IQQA-Liver, IQQA-Liver
  Function, IQQA-eQMR and the IQQA-eFusion edge-AI surgical navigation system. The company is FDA cleared and CE
  marked under EU MDR 2017/745, and raised a US$150 million round led by SoftBank Vision Fund 2 with OrbiMed participation
  in April 2021. EDDA publishes no developer API for IQQA — it is regulated medical device software deployed on-premises
  in hospitals — so the only public API surface catalogued here is the WordPress REST API serving eddatech.com content.
